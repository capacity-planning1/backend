name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  tests:
    name: Smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pytest
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Publish pytest check
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Pytest report
          path: reports/pytest.xml
          reporter: java-junit

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: error

      - name: Publish test summary
        if: always()
        run: |
          echo "## Backend smoke tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "Pytest completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pytest failed. See the pytest-report artifact for details." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment gate
        run: |
          echo "Deploy is allowed only from main after successful tests."
          echo "Add project-specific deployment commands here."
