name: fastapi-compose

x-back-image: &back-image vinwap/capacity-planning-backend:latest
x-front-image: &front-image nginx:stable-alpine-slim

x-back-common: &back-common
  build: .
  image: *back-image
  env_file:
    - .env

services:
  db:
    image: postgres:17-bookworm
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB__POSTGRES_DB}
      POSTGRES_USER: ${DB__POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB__POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB__POSTGRES_USER} -d $${DB__POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    <<: *back-common
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  rbac:
    <<: *back-common
    command: python -m app.bootstrap.admin_user
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *back-common
    command: ["/app/.venv/bin/gunicorn", "-c", "app/core/gunicorn_config.py", "app.main:app"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rbac:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/docs >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  reverse-proxy:
    image: *front-image
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/html:/var/www/html:ro
    restart: unless-stopped

volumes:
  postgres_data:
